<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#102a56">
<title>KTET Guru Plus - Adjustment Mechanisms Drag & Drop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#f8f0ff);
  color:#172033;
  overflow-x:hidden;
}
/* 9:16 portrait stage, full mobile height incl. browser chrome */
.stage{
  width:100%;
  max-width:calc(100dvh * 0.5625);
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
@supports not (height:100dvh){
  .stage{min-height:-webkit-fill-available;min-height:100vh}
}
header{
  background:linear-gradient(90deg,#102a56,#6b1fa4);
  color:white;text-align:center;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px;
  flex-shrink:0;
}
.brand{font-size:clamp(15px,4.5vw,18px);font-weight:900;color:#ffd83d;letter-spacing:1px}
h1{margin:4px 0 2px;font-size:clamp(16px,5vw,19px);line-height:1.15}
.topbar{
  display:flex;gap:8px;justify-content:center;align-items:center;
  background:white;padding:9px 12px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.stat{font-weight:900;font-size:clamp(14px,4vw,15px);color:#173b7a}
.progress{
  height:8px;background:#e5eaf1;overflow:hidden;flex-shrink:0;
}
.bar{height:100%;width:0;background:#26a269;transition:.3s}
.wrap{
  padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;flex:1;min-height:0;
}

/* ---- Left / Right game area ---- */
.game{
  display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:10px;
  flex:1;min-height:0;align-items:start;
}
.cards-label,.drops-label{
  font-weight:900;font-size:clamp(11px,3.4vw,12px);margin:0 0 6px;color:#173b7a;
}
.drops-label{color:#176b3a}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.card{
  padding:10px 5px;border-radius:12px;background:#edf4ff;border:2px solid #c9dcff;
  cursor:grab;font-weight:800;user-select:none;
  font-size:clamp(11px,3.3vw,13px);
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:52px;touch-action:manipulation;line-height:1.2;
  overflow-wrap:anywhere;word-break:break-word;
}
.card.dragging{opacity:.45}
.card.selected{outline:3px solid #ffb000;background:#fff3d6}
.card.done{opacity:.35;cursor:default}

#drops{display:flex;flex-direction:column;gap:8px;min-width:0}
.drop{
  border:2px solid #78b889;border-radius:12px;
  padding:9px 10px;background:#e8f7ec;
  transition:.2s;display:flex;align-items:center;
  font-size:clamp(12px,3.5vw,13px);line-height:1.3;min-height:52px;
  touch-action:manipulation;min-width:0;
}
.drop span{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.drop.over{background:#e8fff1;border-color:#24a05a;transform:scale(1.02)}
.drop.correct{background:#dcffe9;border-color:#24a05a;font-weight:800}
.drop.wrong{background:#ffe3e3;border-color:#d23b3b}
.feedback{
  margin-top:10px;text-align:center;font-weight:900;min-height:22px;
  font-size:clamp(13px,4vw,15px);flex-shrink:0;
}
.finish{
  display:none;margin-top:12px;text-align:center;background:white;padding:18px;
  border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.08);flex-shrink:0;
}
.finish h2{margin:0 0 8px;font-size:clamp(18px,5vw,22px)}
.finish p{font-size:clamp(13px,4vw,15px)}
button{
  border:0;border-radius:10px;padding:12px 18px;font-weight:800;
  cursor:pointer;background:#173b7a;color:white;font-size:clamp(14px,4vw,15px);
  touch-action:manipulation;min-height:44px;
}

/* Small phones: tighter gaps, smaller text, taller tap targets */
@media (max-width:380px){
  .game{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:7px}
  .wrap{padding-left:8px;padding-right:8px}
  .cards,#drops{gap:6px}
  .card{min-height:56px;font-size:11px;padding:8px 4px}
  .drop{min-height:56px;font-size:12px;padding:8px}
}
/* Very short landscape-ish viewports keep everything reachable */
@media (max-height:600px){
  header{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
  .card,.drop{min-height:46px}
}
</style>
<base target="_blank">
</head>
<body>

<!-- Sound effects -->
<audio id="applause" src="applause.mp3" preload="auto"></audio>
<audio id="error" src="error.mp3" preload="auto"></audio>

<div class="stage">
  <header>
    <div class="brand">KTET GURU PLUS</div>
    <h1>ADJUSTMENT MECHANISMS</h1>
  </header>

  <div class="topbar">
    <div class="stat">Score: <span id="score">0</span> / 8</div>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="wrap">
    <div class="game">
      <section>
        <div class="cards-label">Mechanisms</div>
        <div class="cards" id="cards"></div>
      </section>
      <section>
        <div class="drops-label">Meanings</div>
        <div id="drops"></div>
      </section>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="finish" id="finish">
      <h2>Excellent! 🎉</h2>
      <p id="result"></p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>
</div>

<script>
const data = [
 {id:"compensation", name:"Compensation", text:"Overcoming a weakness by developing strength in another area."},
 {id:"rationalization", name:"Rationalization", text:"Giving acceptable reasons to justify one's behaviour."},
 {id:"projection", name:"Projection", text:"Attributing one's own faults or feelings to others."},
 {id:"regression", name:"Regression", text:"Returning to an earlier level of behaviour under stress."},
 {id:"repression", name:"Repression", text:"Keeping painful thoughts outside conscious awareness."},
 {id:"displacement", name:"Displacement", text:"Redirecting emotions from the original target to another target."},
 {id:"sublimation", name:"Sublimation", text:"Channeling unacceptable impulses into socially acceptable activities."},
 {id:"identification", name:"Identification", text:"Adopting the behaviour or qualities of another person."}
];

let score=0, matched=0, selected=null;

function playSound(id){
  const audio=document.getElementById(id);
  if(!audio) return;
  audio.currentTime=0;
  audio.play().catch(()=>{});
}

function shuffle(a){
  const arr=[...a];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function render(){
  const cards=document.getElementById("cards");
  const drops=document.getElementById("drops");
  cards.innerHTML="";
  drops.innerHTML="";
  score=0;matched=0;selected=null;
  document.getElementById("score").textContent=0;
  document.getElementById("bar").style.width="0%";
  document.getElementById("feedback").textContent="";
  document.getElementById("finish").style.display="none";

  shuffle(data).forEach(item=>{
    const el=document.createElement("div");
    el.className="card";
    el.draggable=true;
    el.dataset.id=item.id;
    el.textContent=item.name;
    el.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",item.id);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend",()=>el.classList.remove("dragging"));
    el.addEventListener("click",()=>{
      if(el.classList.contains("done")) return;
      document.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));
      selected=item.id; el.classList.add("selected");
      document.getElementById("feedback").textContent="Now tap the matching meaning.";
    });
    cards.appendChild(el);
  });

  shuffle(data).forEach(item=>{
    const d=document.createElement("div");
    d.className="drop";
    d.dataset.answer=item.id;
    d.innerHTML="<span>"+item.text+"</span>";
    d.addEventListener("dragover",e=>{e.preventDefault();d.classList.add("over")});
    d.addEventListener("dragleave",()=>d.classList.remove("over"));
    d.addEventListener("drop",e=>{
      e.preventDefault(); d.classList.remove("over");
      const id=e.dataTransfer.getData("text/plain");
      check(id,d);
    });
    d.addEventListener("click",()=>{
      if(selected) check(selected,d);
    });
    drops.appendChild(d);
  });
}

function check(id,drop){
  if(drop.classList.contains("correct")) return;
  if(id===drop.dataset.answer){
    drop.classList.add("correct");
    const card=document.querySelector('.card[data-id="'+id+'"]');
    if(card){card.classList.add("done");card.style.cursor="default"}
    score++;matched++;
    document.getElementById("score").textContent=score;
    document.getElementById("bar").style.width=(matched/8*100)+"%";
    document.getElementById("feedback").textContent="Correct! ✅";
    playSound("applause");
    selected=null;
    if(card) card.classList.remove("selected");
    if(matched===8){
      document.getElementById("result").textContent="You matched all 8 mechanisms correctly. Score: 8/8.";
      document.getElementById("finish").style.display="block";
      playSound("applause");
    }
  }else{
    drop.classList.add("wrong");
    document.getElementById("feedback").textContent="Try again — not the correct match. ❌";
    playSound("error");
    setTimeout(()=>drop.classList.remove("wrong"),650);
  }
}

function resetGame(){render()}
render();
</script>
</body>
</html>
